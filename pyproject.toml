[project]
name = "quant"
version = "2.0.0"
description = "Multi-Subject AI Tutor with RAG and WhatsApp Integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-community>=0.3.0,<0.4.0",
    "pypdf>=6.4.2",
    "pymupdf",
    "langchain-core",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.21",
    "jinja2>=3.1.6",
    "langchain-openai",
    "faiss-cpu>=1.13.2",
    "reportlab>=4.4.7",
    "langchain-google-genai",
    "python-dotenv>=1.2.1",
    "langchain>=0.3.0,<0.4.0",
    "google-generativeai>=0.8.6",
    "langchain-groq>=0.3.8",
    # New dependencies for multi-subject tutor
    "supabase>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

